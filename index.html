<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>MODLAND Admin</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><style>:root{--b:#09090b;--p:#151519;--p2:#1d1d22;--t:#f7f2e8;--m:#aaa7a0;--g:#d7b64a;--l:#332f26;--r:#ff7676}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}.wrap{max-width:820px;margin:auto;padding:14px 14px 90px}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:14px;margin-top:12px}.top{position:sticky;top:0;z-index:10;background:#09090be8;backdrop-filter:blur(10px);padding:10px 0}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.inp{width:100%;background:var(--p2);border:1px solid var(--l);color:var(--t);border-radius:12px;padding:11px;outline:none}.field{display:block;margin:8px 0}.field span{display:block;color:var(--m);font-size:11px;margin-bottom:5px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.gold{background:var(--g);color:#09090b}.ghost{background:var(--p2);color:var(--t);border:1px solid var(--l)}.danger{background:#381919;color:#ffb5b5;border:1px solid #672a2a}.sm{font-size:12px;padding:8px 10px}.muted{color:var(--m)}.hide{display:none!important}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.tab{background:var(--p);color:var(--m);border:1px solid var(--l);border-radius:12px;padding:9px}.tab.active{color:var(--g);border-color:#705f25}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #29272d}.item:last-child{border:0}.meta{font-size:11px;color:var(--m);margin-top:4px}.ltr{direction:ltr;text-align:left}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(430px,100%);padding:24px}.login h1{color:var(--g);text-align:center}.logo{width:42px;height:42px;border-radius:13px;background:var(--g);color:#09090b;display:grid;place-items:center;font-weight:900}.modal{position:fixed;inset:0;background:#000c;z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(820px,100%);max-height:93vh;overflow:auto;background:#101013;border:1px solid var(--l);border-radius:22px 22px 0 0;padding:14px 14px 35px}.media{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.media img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.msg{font-size:12px;min-height:18px;margin-top:6px}.ok{color:#8fe0a8}.err{color:#ff9c9c}@media(max-width:560px){.grid{grid-template-columns:1fr}.media{grid-template-columns:repeat(2,1fr)}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><section id="login" class="login"><form id="loginForm" class="card"><div class="logo" style="margin:auto">M</div><h1>MODLAND Admin</h1><p class="muted" style="text-align:center;font-size:12px">ورود امن مدیریت فروشگاه</p><label class="field"><span>ایمیل</span><input id="email" class="inp ltr" type="email" required></label><label class="field"><span>رمز عبور</span><input id="pass" class="inp ltr" type="password" required></label><button class="btn gold" style="width:100%">ورود</button><div id="loginMsg" class="msg"></div></form></section><main id="app" class="hide"><div class="wrap"><header class="top"><div class="row between"><div class="row"><div class="logo">M</div><div><b style="color:var(--g)">MODLAND Admin</b><div id="who" class="muted ltr" style="font-size:10px"></div></div></div><button id="logout" class="btn ghost sm">خروج</button></div><nav class="tabs"><button class="tab active" data-tab="products">محصولات</button><button class="tab" data-tab="store">فروشگاه</button><button class="tab" class="sheet"><div class="row between"><b>ویرایش محصول</b><button id="closeProduct" class="btn ghost sm">بستن</button></div><form id="productForm"><input type="hidden" name="id"><div class="grid"><label class="field"><span>کد</span><input name="code" class="inp ltr" required></label><label class="field"><span>نام</span><input name="name" class="inp" required></label><label class="field"><span>برند</span><input name="brand" class="inp"></label><label class="field"><span>دسته</span><select name="category_id" class="inp"></select></label><label class="field"><span>قیمت تومان</span><input name="price_toman" type="number" class="inp ltr"></label><label class="field"><span>قیمت قبلی</span><input name="old_price_toman" type="number" class="inp ltr"></label><label class="field"><span>سایزها با کاما</span><input name="sizes" class="inp ltr"></label><label class="field"><span>موجودی</span><input name="stock_status" class="inp"></label><label class="field"><span>بج</span><input name="badge" class="inp"></label><label class="field"><span>ترتیب</span><input name="sort_order" type="number" class="inp ltr"></label></div><label class="field"><span>متن ارسال</span><input name="shipping_text" class="inp"></label><label class="field"><span>توضیحات</span><textarea name="description" class="inp" rows="3"></textarea></label><label class="field"><span>ویژگی‌ها؛ هر خط یک مورد</span><textarea name="features" class="inp" rows="3"></textarea></label><label class="field"><span>راهنمای سایز</span><textarea name="size_guide" class="inp" rows="2"></textarea></label><label class="row"><input name="is_published" type="checkbox"> منتشر شده</label><div class="row" style="margin-top:12px"><button class="btn gold">ذخیره</button><button id="deleteProduct" type="button" class="btn danger">حذف</button></div><div id="productMsg" class="msg"></div></form><div id="mediaBox" class="card"><div class="row between"><b>عکس / ویدیو</b><label class="btn ghost sm">آپلود<input id="mediaInput" type="file" accept="image/*,video/mp4" multiple hidden></label></div><div id="mediaList" class="media" style="margin-top:10px"></div></div></div></div><div id="catModal" class="modal hide"><div class="sheet"><div class="row between"><b>دسته</b><button id="closeCat" class="btn ghost sm">بستن</button></div><form id="catForm"><input type="hidden" name="id"><label class="field"><span>نام</span><input name="name" class="inp" required></label><label class="field"><span>slug</span><input name="slug" class="inp ltr" required></label><label class="field"><span>ترتیب</span><input name="sort_order" type="number" class="inp ltr"></label><label class="row"><input name="is_visible" type="checkbox"> قابل نمایش</label><div class="row" style="margin-top:12px"><button class="btn gold">ذخیره</button><button id="deleteCat" type="button" class="btn danger">حذف</button></div><div id="catMsg" class="msg"></div></form></div></div><script>const URL='https://bemkwibdtjrvrstlmvca.supabase.co',KEY='sb_publishable_oqpsHvl6ty2aYmAkxwfwfw_pjsN8a6p',db=supabase.createClient(URL,KEY);let products=[],cats=[],current=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],msg=(e,t,c='')=>{e.textContent=t;e.className='msg '+c},esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>n==null?'—':Number(n).toLocaleString('fa-IR')+' تومان';async function adminSession(){const {data:{session}}=await db.auth.getSession();if(!session)return null;const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!data)return null;return session}async function boot(){const s=await adminSession();if(!s)return;$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=s.user.email;await loadAll()}async function loadAll(){await Promise.all([loadProducts(),loadCats(),loadStore()])}async function loadProducts(){const {data,error}=await db.from('products').select('*').order('sort_order').order('created_at');if(error)return alert(error.message);products=data||[];renderProducts()}function renderProducts(){const q=$('#search').value.trim().toLowerCase(),a=products.filter(p=>(p.name+' '+p.code).toLowerCase().includes(q));$('#productList').innerHTML=a.length?a.map(p=>`<div class="item"><div><b>${esc(p.name)}</b>${p.is_published?'':' <span class="muted">(پیش‌نویس)</span>'}<div class="meta"><span dir="ltr">${esc(p.code)}</span> · ${money(p.price_toman)} · ${esc(p.stock_status)}</div></div><button class="btn ghost sm" onclick="openProduct('${p.id}')">ویرایش</button></div>`).join(''):'<div class="muted" style="padding:25px;text-align:center">محصولی نیست</div>'}async function loadCats(){const {data,error}=await db.from('categories').select('*').order('sort_order').order('created_at');if(error)return alert(error.message);cats=data||[];$('#catList').innerHTML=cats.map(c=>`<div class="item"><div><b>${esc(c.name)}</b><div class="meta ltr">${esc(c.slug)}</div></div><button class="btn ghost sm" onclick="openCat('${c.id}')">ویرایش</button></div>`).join('');$('#productForm').elements.category_id.innerHTML='<option value="">بدون دسته</option>'+cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}async function loadStore(){const {data,error}=await db.from('store_profile').select('*').eq('id','main').maybeSingle();if(error||!data)return;const f=$('#storeForm');Object.keys(data).forEach(k=>{if(f.elements[k])f.elements[k].value=data[k]??''})}window.openProduct=async id=>{current=products.find(x=>x.id===id)||null;const f=$('#productForm');f.reset();['id','code','name','brand','category_id','price_toman','old_price_toman','stock_status','badge','sort_order','shipping_text','description','size_guide'].forEach(k=>{if(f.elements[k])f.elements[k].value=current?.[k]??''});f.elements.sizes.value=Array.isArray(current?.sizes)?current.sizes.join(', '):'';f.elements.features.value=Array.isArray(current?.features)?current.features.join('\n'):'';f.elements.is_published.checked=current?!!current.is_published:true;$('#deleteProduct').style.display=current?'inline-block':'none';$('#mediaBox').style.display=current?'block':'none';$('#productModal').classList.remove('hide');if(current)await loadMedia()};async function loadMedia(){const {data,error}=await db.from('product_media').select('*').eq('product_id',current.id).order('sort_order').order('created_at');if(error)return;$('#mediaList').innerHTML=(data||[]).map(m=>{const u=m.external_url||(m.storage_path?db.storage.from('modland-media').getPublicUrl(m.storage_path).data.publicUrl:'');return `<div>${m.media_type==='image'?`<img src="${u}">`:`<div class="card" style="text-align:center">▶ ویدیو</div>`}<div class="row"><button class="btn ghost sm" onclick="featureMedia('${m.id}')">⭐</button><button class="btn danger sm" onclick="removeMedia('${m.id}','${m.storage_path||''}')">×</button></div></div>`}).join('')}window.featureMedia=async id=>{await db.from('product_media').update({is_featured:false}).eq('product_id',current.id);await db.from('product_media').update({is_featured:true}).eq('id',id);loadMedia()};window.removeMedia=async(id,path)=>{if(!confirm('حذف رسانه؟'))return;if(path)await db.storage.from('modland-media').remove([path]);await db.from('product_media').delete().eq('id',id);loadMedia()};$('#loginForm').onsubmit=async e=>{e.preventDefault();msg($('#loginMsg'),'در حال ورود…');const {error}=await db.auth.signInWithPassword({email:$('#email').value,password:$('#pass').value});if(error)return msg($('#loginMsg'),error.message,'err');const s=await adminSession();if(!s){await db.auth.signOut();return msg($('#loginMsg'),'این حساب دسترسی ادمین ندارد.','err')}location.reload()};$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['products','store','cats'].forEach(x=>$('#'+x).classList.toggle('hide',x!==b.dataset.tab))});$('#search').oninput=renderProducts;$('#newProduct').onclick=()=>openProduct(null);$('#closeProduct').onclick=()=>$('#productModal').classList.add('hide');$('#productForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,id=f.elements.id.value,v=k=>f.elements[k].value.trim(),body={code:v('code'),name:v('name'),brand:v('brand')||null,category_id:v('category_id')||null,price_toman:v('price_toman')?Number(v('price_toman')):null,old_price_toman:v('old_price_toman')?Number(v('old_price_toman')):null,sizes:v('sizes').split(',').map(x=>x.trim()).filter(Boolean),stock_status:v('stock_status')||'موجود',badge:v('badge')||null,sort_order:Number(v('sort_order')||0),shipping_text:v('shipping_text')||null,description:v('description')||null,features:v('features').split('\n').map(x=>x.trim()).filter(Boolean),size_guide:v('size_guide')||null,is_published:f.elements.is_published.checked};msg($('#productMsg'),'در حال ذخیره…');const q=id?db.from('products').update(body).eq('id',id).select().single():db.from('products').insert(body).select().single(),{data,error}=await q;if(error)return msg($('#productMsg'),error.message,'err');current=data;f.elements.id.value=data.id;$('#mediaBox').style.display='block';$('#deleteProduct').style.display='inline-block';msg($('#productMsg'),'ذخیره شد','ok');await loadProducts()};$('#deleteProduct').onclick=async()=>{if(!current||!confirm('محصول کامل حذف شود؟'))return;const {error}=await db.from('products').delete().eq('id',current.id);if(error)return alert(error.message);$('#productModal').classList.add('hide');await loadProducts()};$('#mediaInput').onchange=async e=>{if(!current)return;for(const file of [...e.target.files]){const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`products/${current.code||current.id}/${Date.now()}-${safe}`;const {error:up}=await db.storage.from('modland-media').upload(path,file,{upsert:true,contentType:file.type});if(up){alert(up.message);continue}const {error:ins}=await db.from('product_media').insert({product_id:current.id,media_type:file.type.startsWith('video')?'video':'image',storage_path:path,is_visible:true,is_featured:false,sort_order:0});if(ins)alert(ins.message)}e.target.value='';loadMedia()};$('#storeForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,body={};['store_name','catalog_title','category_label','tagline','watermark','footer_note','address','order_id','phone1','phone2','rubika_url','telegram_url','instagram_url'].forEach(k=>body[k]=f.elements[k].value.trim()||null);const {error}=await db.from('store_profile').update(body).eq('id','main');msg($('#storeMsg'),error?error.message:'ذخیره شد',error?'err':'ok')};window.openCat=id=>{const c=cats.find(x=>x.id===id)||null,f=$('#catForm');f.reset();f.elements.id.value=c?.id||'';f.elements.name.value=c?.name||'';f.elements.slug.value=c?.slug||'';f.elements.sort_order.value=c?.sort_order??0;f.elements.is_visible.checked=c?!!c.is_visible:true;$('#deleteCat').style.display=c?'inline-block':'none';$('#catModal').classList.remove('hide')};$('#newCat').onclick=()=>openCat(null);$('#closeCat').onclick=()=>$('#catModal').classList.add('hide');$('#catForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,id=f.elements.id.value,body={name:f.elements.name.value.trim(),slug:f.elements.slug.value.trim(),sort_order:Number(f.elements.sort_order.value||0),is_visible:f.elements.is_visible.checked},q=id?db.from('categories').update(body).eq('id',id):db.from('categories').insert(body),{error}=await q;if(error)return msg($('#catMsg'),error.message,'err');$('#catModal').classList.add('hide');await loadCats()};$('#deleteCat').onclick=async()=>{const id=$('#catForm').elements.id.value;if(!id||!confirm('دسته حذف شود؟'))return;const {error}=await db.from('categories').delete().eq('id',id);if(error)return msg($('#catMsg'),'اول محصولات این دسته را جابه‌جا کن.','err');$('#catModal').classList.add('hide');loadCats()};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));boot();</script></body></html>
