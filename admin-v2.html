<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>MODLAND Admin</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><style>:root{--b:#09090b;--p:#151519;--p2:#1d1d22;--t:#f7f2e8;--m:#aaa7a0;--g:#d7b64a;--l:#332f26;--r:#ff7676}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}.wrap{max-width:860px;margin:auto;padding:14px 14px 90px}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:14px;margin-top:12px}.top{position:sticky;top:0;z-index:10;background:#09090be8;backdrop-filter:blur(10px);padding:10px 0}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.inp{width:100%;background:var(--p2);border:1px solid var(--l);color:var(--t);border-radius:12px;padding:11px;outline:none}.field{display:block;margin:8px 0}.field span{display:block;color:var(--m);font-size:11px;margin-bottom:5px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.gold{background:var(--g);color:#09090b}.ghost{background:var(--p2);color:var(--t);border:1px solid var(--l)}.danger{background:#381919;color:#ffb5b5;border:1px solid #672a2a}.sm{font-size:12px;padding:8px 10px}.muted{color:var(--m)}.hide{display:none!important}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.tab{background:var(--p);color:var(--m);border:1px solid var(--l);border-radius:12px;padding:9px}.tab.active{color:var(--g);border-color:#705f25}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #29272d}.item:last-child{border:0}.meta{font-size:11px;color:var(--m);margin-top:4px}.ltr{direction:ltr;text-align:left}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(430px,100%);padding:24px}.login h1{color:var(--g);text-align:center}.logo{width:42px;height:42px;border-radius:13px;background:var(--g);color:#09090b;display:grid;place-items:center;font-weight:900}.modal{position:fixed;inset:0;background:#000c;z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(860px,100%);max-height:93vh;overflow:auto;background:#101013;border:1px solid var(--l);border-radius:22px 22px 0 0;padding:14px 14px 35px}.media{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.media img,.media video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.msg{font-size:12px;min-height:18px;margin-top:7px}.ok{color:#8fe0a8}.err{color:#ff9c9c}@media(max-width:560px){.grid{grid-template-columns:1fr}.media{grid-template-columns:repeat(2,1fr)}}</style></head><body><section id="login" class="login"><form id="loginForm" class="card"><div class="logo" style="margin:auto">M</div><h1>MODLAND Admin</h1><p class="muted" style="text-align:center;font-size:12px">ورود مستقیم و امن از Supabase</p><label class="field"><span>ایمیل</span><input id="email" class="inp ltr" type="email" autocomplete="username" required></label><label class="field"><span>رمز عبور</span><input id="pass" class="inp ltr" type="password" autocomplete="current-password" required></label><button id="loginBtn" class="btn gold" style="width:100%">ورود</button><div id="loginMsg" class="msg"></div></form></section><main id="app" class="hide"><div class="wrap"><header class="top"><div class="row between"><div class="row"><div class="logo">M</div><div><b style="color:var(--g)">MODLAND Admin</b><div id="who" class="muted ltr" style="font-size:10px"></div></div></div><button id="logout" class="btn ghost sm">خروج</button></div><nav class="tabs"><button class="tab active" data-tab="products">محصولات</button><button class="tab" data-tab="store">فروشگاه</button><button class="tab" da ass="sheet"><div class="row between"><b>ویرایش محصول</b><button id="closeProduct" class="btn ghost sm">بستن</button></div><form id="productForm"><input type="hidden" name="id"><div class="grid"><label class="field"><span>کد</span><input name="code" class="inp ltr" required></label><label class="field"><span>نام</span><input name="name" class="inp" required></label><label class="field"><span>برند</span><input name="brand" class="inp"></label><label class="field"><span>دسته</span><select name="category_id" class="inp"></select></label><label class="field"><span>قیمت تومان</span><input name="price_toman" type="number" class="inp ltr"></label><label class="field"><span>قیمت قبلی</span><input name="old_price_toman" type="number" class="inp ltr"></label><label class="field"><span>سایزها با کاما</span><input name="sizes" class="inp ltr"></label><label class="field"><span>موجودی</span><input name="stock_status" class="inp"></label><label class="field"><span>بج</span><input name="badge" class="inp"></label><label class="field"><span>ترتیب</span><input name="sort_order" type="number" class="inp ltr"></label></div><label class="field"><span>متن ارسال</span><input name="shipping_text" class="inp"></label><label class="field"><span>توضیحات</span><textarea name="description" class="inp" rows="3"></textarea></label><label class="field"><span>ویژگی‌ها؛ هر خط یک مورد</span><textarea name="features" class="inp" rows="3"></textarea></label><label class="field"><span>راهنمای سایز</span><textarea name="size_guide" class="inp" rows="2"></textarea></label><label class="row"><input name="is_published" type="checkbox"> منتشر شده</label><div class="row" style="margin-top:12px"><button class="btn gold">ذخیره</button><button id="deleteProduct" type="button" class="btn danger">حذف</button></div><div id="productMsg" class="msg"></div></form><div id="mediaBox" class="card"><div class="row between"><b>عکس / ویدیو</b><label class="btn ghost sm">آپلود<input id="mediaInput" type="file" accept="image/*,video/mp4" multiple hidden></label></div><div id="mediaList" class="media" style="margin-top:10px"></div></div></div></div><div id="catModal" class="modal hide"><div class="sheet"><div class="row between"><b>دسته</b><button id="closeCat" class="btn ghost sm">بستن</button></div><form id="catForm"><input type="hidden" name="id"><label class="field"><span>نام</span><input name="name" class="inp" required></label><label class="field"><span>slug</span><input name="slug" class="inp ltr" required></label><label class="field"><span>ترتیب</span><input name="sort_order" type="number" class="inp ltr"></label><label class="row"><input name="is_visible" type="checkbox"> قابل نمایش</label><div class="row" style="margin-top:12px"><button class="btn gold">ذخیره</button><button id="deleteCat" type="button" class="btn danger">حذف</button></div><div id="catMsg" class="msg"></div></form></div></div><script>
const BASE='https://bemkwibdtjrvrstlmvca.supabase.co',KEY='sb_publishable_oqpsHvl6ty2aYmAkxwfwfw_pjsN8a6p',STORE='modland_admin_session_v2';let session=null,products=[],cats=[],current=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>n==null?'—':Number(n).toLocaleString('fa-IR')+' تومان',msg=(e,t,c='')=>{e.textContent=t;e.className='msg '+c};
function saveSession(s){session=s;if(s)localStorage.setItem(STORE,JSON.stringify(s));else localStorage.removeItem(STORE)}function loadSession(){try{session=JSON.parse(localStorage.getItem(STORE)||'null')}catch{session=null}return session}function authHeaders(json=true){const h={apikey:KEY};if(session?.access_token)h.Authorization='Bearer '+session.access_token;if(json)h['Content-Type']='application/json';return h}async function parseRes(r){let body=null,txt=await r.text();if(txt){try{body=JSON.parse(txt)}catch{body=txt}}if(!r.ok){let e=new Error(body?.msg||body?.message||body?.error_description||body?.error||('HTTP '+r.status));e.status=r.status;throw e}return body}
async function login(email,password){let r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.trim().toLowerCase(),password})}),d=await parseRes(r),s={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+((d.expires_in||3600)*1000),user:d.user};saveSession(s);return s}async function refreshSession(){if(!session?.refresh_token)return null;try{let r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})}),d=await parseRes(r);saveSession({access_token:d.access_token,refresh_token:d.refresh_token||session.refresh_token,expires_at:Date.now()+((d.expires_in||3600)*1000),user:d.user||session.user});return session}catch{saveSession(null);return null}}async function ensureSession(){loadSession();if(!session)return null;if(session.expires_at-Date.now()<60000)await refreshSession();return session}async function logout(){try{if(session?.access_token)await fetch(BASE+'/auth/v1/logout',{method:'POST',headers:authHeaders(false)})}catch{}saveSession(null)}
async function rest(table,{method='GET',select='*',filters=[],order=[],body=null,single=false,maybe=false}={}){await ensureSession();let u=new URL(BASE+'/rest/v1/'+table);if(select)u.searchParams.set('select',select);for(const [k,v] of filters)u.searchParams.append(k,'eq.'+v);if(order.length)u.searchParams.set('order',order.map(x=>x+'.asc').join(','));let h=authHeaders(body!==null);if(method!=='GET')h.Prefer='return=representation';let r=await fetch(u,{method,headers:h,body:body===null?undefined:JSON.stringify(body)}),d=await parseRes(r);if(method==='DELETE'&&d===null)d=[];if(single||maybe){if(Array.isArray(d)){if(!d.length){if(maybe)return null;throw new Error('رکورد پیدا نشد')}return d[0]}return d}return d}async function isAdmin(){if(!await ensureSession())return false;try{return !!await rest('admin_users',{filters:[['user_id',session.user.id]],maybe:true})}catch{return false}}
async function storageUpload(bucket,path,file){await ensureSession();let r=await fetch(BASE+'/storage/v1/object/'+bucket+'/'+path.split('/').map(encodeURIComponent).join('/'),{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':file.type||'application/octet-stream','x-upsert':'true'},body:file});return parseRes(r)}async function storageRemove(bucket,paths){await ensureSession();let r=await fetch(BASE+'/storage/v1/object/'+bucket,{method:'DELETE',headers:authHeaders(),body:JSON.stringify({prefixes:paths})});return parseRes(r)}const publicUrl=(bucket,path)=>BASE+'/storage/v1/object/public/'+bucket+'/'+path.split('/').map(encodeURIComponent).join('/');
async function boot(){await ensureSession();if(!session)return;if(!await isAdmin()){await logout();msg($('#loginMsg'),'این حساب دسترسی ادمین ندارد.','err');return}$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=session.user?.email||'';await loadAll()}async function loadAll(){await Promise.all([loadProducts(),loadCats(),loadStore()])}async function loadProducts(){try{products=await rest('products',{order:['sort_order','created_at']})||[];renderProducts()}catch(e){alert(e.message)}}function renderProducts(){let q=$('#search').value.trim().toLowerCase(),a=products.filter(p=>(p.name+' '+p.code).toLowerCase().includes(q));$('#productList').innerHTML=a.length?a.map(p=>`<div class="item"><div><b>${esc(p.name)}</b>${p.is_published?'':' <span class="muted">(پیش‌نویس)</span>'}<div class="meta"><span dir="ltr">${esc(p.code)}</span> · ${money(p.price_toman)} · ${esc(p.stock_status)}</div></div><button class="btn ghost sm" onclick="openProduct('${p.id}')">ویرایش</button></div>`).join(''):'<div class="muted" style="padding:25px;text-align:center">محصولی نیست</div>'}async function loadCats(){try{cats=await rest('categories',{order:['sort_order','created_at']})||[];$('#catList').innerHTML=cats.map(c=>`<div class="item"><div><b>${esc(c.name)}</b><div class="meta ltr">${esc(c.slug)}</div></div><button class="btn ghost sm" onclick="openCat('${c.id}')">ویرایش</button></div>`).join('');$('#productForm').elements.category_id.innerHTML='<option value="">بدون دسته</option>'+cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}catch(e){alert(e.message)}}async function loadStore(){try{let d=await rest('store_profile',{filters:[['id','main']],maybe:true});if(!d)return;let f=$('#storeForm');Object.keys(d).forEach(k=>{if(f.elements[k])f.elements[k].value=d[k]??''})}catch(e){alert(e.message)}}
window.openProduct=async id=>{current=products.find(x=>x.id===id)||null;let f=$('#productForm');f.reset();['id','code','name','brand','category_id','price_toman','old_price_toman','stock_status','badge','sort_order','shipping_text','description','size_guide'].forEach(k=>{if(f.elements[k])f.elements[k].value=current?.[k]??''});f.elements.sizes.value=Array.isArray(current?.sizes)?current.sizes.join(', '):'';f.elements.features.value=Array.isArray(current?.features)?current.features.join('\n'):'';f.elements.is_published.checked=current?!!current.is_published:true;$('#deleteProduct').style.display=current?'inline-block':'none';$('#mediaBox').style.display=current?'block':'none';$('#productModal').classList.remove('hide');if(current)await loadMedia()};async function loadMedia(){try{let data=await rest('product_media',{filters:[['product_id',current.id]],order:['sort_order','created_at']})||[];$('#mediaList').innerHTML=data.map(m=>{let u=m.external_url||(m.storage_path?publicUrl('modland-media',m.storage_path):'');return `<div>${m.media_type==='image'?`<img src="${u}" alt="">`:`<video src="${u}" controls></video>`}<div class="row"><button class="btn ghost sm" onclick="featureMedia('${m.id}')">⭐</button><button class="btn danger sm" onclick="removeMedia('${m.id}','${m.storage_path||''}')">×</button></div></div>`}).join('')}catch(e){alert(e.message)}}window.featureMedia=async id=>{try{await rest('product_media',{method:'PATCH',filters:[['product_id',current.id]],body:{is_featured:false},select:'*'});await rest('product_media',{method:'PATCH',filters:[['id',id]],body:{is_featured:true},select:'*'});loadMedia()}catch(e){alert(e.message)}};window.removeMedia=async(id,path)=>{if(!confirm('حذف رسانه؟'))return;try{if(path)await storageRemove('modland-media',[path]);await rest('product_media',{method:'DELETE',filters:[['id',id]],select:'*'});loadMedia()}catch(e){alert(e.message)}};
$('#loginForm').onsubmit=async e=>{e.preventDefault();let b=$('#loginBtn');b.disabled=true;msg($('#loginMsg'),'در حال اتصال به Supabase…');try{await login($('#email').value,$('#pass').value);if(!await isAdmin()){await logout();throw new Error('این حساب دسترسی ادمین ندارد.')}msg($('#loginMsg'),'ورود موفق؛ در حال باز کردن پنل…','ok');location.reload()}catch(e){let t=e.message||'خطای نامشخص';if(/Invalid login credentials/i.test(t))t='ایمیل یا رمز عبور اشتباه است.';if(/Failed to fetch|NetworkError|Load failed/i.test(t))t='اتصال به Supabase برقرار نشد. اینترنت را چک کن و دوباره بزن.';msg($('#loginMsg'),t,'err')}finally{b.disabled=false}};$('#logout').onclick=async()=>{await logout();location.reload()};$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['products','store','cats'].forEach(x=>$('#'+x).classList.toggle('hide',x!==b.dataset.tab))});$('#search').oninput=renderProducts;$('#newProduct').onclick=()=>openProduct(null);$('#closeProduct').onclick=()=>$('#productModal').classList.add('hide');
$('#productForm').onsubmit=async e=>{e.preventDefault();let f=e.currentTarget,id=f.elements.id.value,v=k=>f.elements[k].value.trim(),body={code:v('code'),name:v('name'),brand:v('brand')||null,category_id:v('category_id')||null,price_toman:v('price_toman')?Number(v('price_toman')):null,old_price_toman:v('old_price_toman')?Number(v('old_price_toman')):null,sizes:v('sizes').split(',').map(x=>x.trim()).filter(Boolean),stock_status:v('stock_status')||'موجود',badge:v('badge')||null,sort_order:Number(v('sort_order')||0),shipping_text:v('shipping_text')||null,description:v('description')||null,features:v('features').split('\n').map(x=>x.trim()).filter(Boolean),size_guide:v('size_guide')||null,is_published:f.elements.is_published.checked};msg($('#productMsg'),'در حال ذخیره…');try{let data=await rest('products',{method:id?'PATCH':'POST',filters:id?[['id',id]]:[],body,single:true});current=data;f.elements.id.value=data.id;$('#mediaBox').style.display='block';$('#deleteProduct').style.display='inline-block';msg($('#productMsg'),'ذخیره شد','ok');await loadProducts()}catch(e){msg($('#productMsg'),e.message,'err')}};$('#deleteProduct').onclick=async()=>{if(!current||!confirm('محصول کامل حذف شود؟'))return;try{await rest('products',{method:'DELETE',filters:[['id',current.id]],select:'*'});$('#productModal').classList.add('hide');await loadProducts()}catch(e){alert(e.message)}};$('#mediaInput').onchange=async e=>{if(!current)return;for(const file of [...e.target.files]){try{let safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`products/${current.code||current.id}/${Date.now()}-${safe}`;await storageUpload('modland-media',path,file);await rest('product_media',{method:'POST',body:{product_id:current.id,media_type:file.type.startsWith('video')?'video':'image',storage_path:path,is_visible:true,is_featured:false,sort_order:0},select:'*'})}catch(err){alert(err.message)}}e.target.value='';loadMedia()};$('#storeForm').onsubmit=async e=>{e.preventDefault();let f=e.currentTarget,body={};['store_name','catalog_title','category_label','tagline','watermark','footer_note','address','order_id','phone1','phone2','rubika_url','telegram_url','instagram_url'].forEach(k=>body[k]=f.elements[k].value.trim()||null);try{await rest('store_profile',{method:'PATCH',filters:[['id','main']],body,select:'*'});msg($('#storeMsg'),'ذخیره شد','ok')}catch(err){msg($('#storeMsg'),err.message,'err')}};
window.openCat=id=>{let c=cats.find(x=>x.id===id)||null,f=$('#catForm');f.reset();f.elements.id.value=c?.id||'';f.elements.name.value=c?.name||'';f.elements.slug.value=c?.slug||'';f.elements.sort_order.value=c?.sort_order??0;f.elements.is_visible.checked=c?!!c.is_visible:true;$('#deleteCat').style.display=c?'inline-block':'none';$('#catModal').classList.remove('hide')};$('#newCat').onclick=()=>openCat(null);$('#closeCat').onclick=()=>$('#catModal').classList.add('hide');$('#catForm').onsubmit=async e=>{e.preventDefault();let f=e.currentTarget,id=f.elements.id.value,body={name:f.elements.name.value.trim(),slug:f.elements.slug.value.trim(),sort_order:Number(f.elements.sort_order.value||0),is_visible:f.elements.is_visible.checked};try{await rest('categories',{method:id?'PATCH':'POST',filters:id?[['id',id]]:[],body,select:'*'});$('#catModal').classList.add('hide');await loadCats()}catch(err){msg($('#catMsg'),err.message,'err')}};$('#deleteCat').onclick=async()=>{let id=$('#catForm').elements.id.value;if(!id||!confirm('دسته حذف شود؟'))return;try{await rest('categories',{method:'DELETE',filters:[['id',id]],select:'*'});$('#catModal').classList.add('hide');loadCats()}catch{msg($('#catMsg'),'اول محصولات این دسته را جابه‌جا کن.','err')}};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));boot();
