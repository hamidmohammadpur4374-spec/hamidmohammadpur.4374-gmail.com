name: Deploy MODLAND to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static app
        shell: bash
        run: |
          set -euo pipefail
          node --check catalog/catalog-pro-v9.js
          node --check catalog/product-pro-v8.js
          node --check catalog/catalog-policy-v2.js
          node --check admin-pro-core.js
          node --check admin-pro-products.js
          node --check admin-pro-admin.js
          node --check admin-vnext.js
          node --check admin-pro-v2.js
          node --check admin-ui-v3.js
          node --check admin-catalog-only-v1.js
          node --check catalog/sw.js
          node --check sw.js
          node --check qa/db-integrity.mjs
          node --check qa/tests/mock.mjs
          node --check qa/tests/customer.spec.mjs
          node --check qa/tests/admin.spec.mjs
          node --check qa/tests/live.spec.mjs
          test -s catalog/index.html
          test -s catalog/product.html
          test -s catalog/catalog-policy-v2.js
          test -s admin-v2.html
          test -s apple-touch-icon.png
          test -s qa/package.json
          test -s qa/playwright.config.mjs
          grep -q 'catalog-pro-v9.js' catalog/index.html
          grep -q 'catalog-policy-v2.js' catalog/index.html
          grep -q 'product-pro-v8.js' catalog/product.html
          grep -q 'catalog-policy-v2.js' catalog/product.html
          grep -q 'admin-ui-v3.js' admin-v2.html
          grep -q 'admin-catalog-only-v1.js' admin-v2.html
          grep -q 'Content-Security-Policy' admin-v2.html
          grep -q "modland-customer-v17" catalog/sw.js
          grep -q "catalog-policy-v2.js?v=17" catalog/sw.js
          grep -q "modland-admin-v14" sw.js
          grep -q "serviceWorker.register('./sw.js?v=12'" admin-pro-admin.js
          grep -q "serviceWorker.register('./sw.js?v=12'" admin-ui-v3.js
          python -m json.tool catalog/manifest.webmanifest >/dev/null
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool qa/package.json >/dev/null
          if grep -q '<script>' catalog/index.html catalog/product.html admin-v2.html; then echo 'Inline script blocked by CSP'; exit 1; fi
          grep -q "script-src 'self'" catalog/index.html
          grep -q "script-src 'self'" catalog/product.html
          grep -q "script-src 'self'" admin-v2.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Supabase snapshot integrity gate
        run: node qa/db-integrity.mjs

      - name: Install QA dependencies
        working-directory: qa
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: qa
        run: npx playwright install --with-deps chromium webkit

      - name: Browser regression gate
        working-directory: qa
        run: npm test

      - name: Prepare production artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html admin-v2.html admin-pro-v1.css admin-platform-v2.css admin-pro-core.js admin-pro-products.js admin-pro-admin.js admin-vnext.js admin-pro-v2.js admin-ui-v3.js admin-catalog-only-v1.js sw.js manifest.webmanifest icon.svg apple-touch-icon.png _site/
          cp -a catalog _site/catalog
          test ! -e _site/qa
          test ! -e _site/node_modules
          test -s _site/catalog/index.html
          test -s _site/admin-v2.html
          test -s _site/admin-catalog-only-v1.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production smoke test
        working-directory: qa
        env:
          QA_BASE_URL: https://hamidmohammadpur4374-spec.github.io/hamidmohammadpur.4374-gmail.com/
        run: npm run test:live

      - name: Upload QA diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: modland-qa-failure-${{ github.run_number }}
          path: |
            qa/qa-report
            qa/test-results
          if-no-files-found: ignore
          retention-days: 7
