<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="description" content="کاتالوگ آنلاین فروشگاه مدلند قشم">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MODLAND">
<title>MODLAND.QESHM | کاتالوگ مدلند</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="../icon.svg">
<style>
:root{--b:#09090b;--p:#151519;--p2:#1c1c21;--t:#f7f2e8;--m:#aaa7a0;--g:#d7b64a;--g2:#f1d66f;--l:#302d27;--r:20px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -20%,#33280d66,transparent 34%),var(--b);color:var(--t);font-family:Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{max-width:560px;margin:auto;padding:14px 14px calc(105px + var(--safe))}
.panel{background:linear-gradient(145deg,#17171b,#101012);border:1px solid var(--l);border-radius:var(--r);overflow:hidden}
.hero{position:relative;min-height:230px}.heroBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(#0000,#09090bf5)}
.heroIn{position:relative;z-index:1;min-height:230px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end}.logo{width:50px;height:50px;border-radius:15px;background:var(--g);object-fit:cover;border:1px solid #f1d66f55}
.wm{font-size:10px;letter-spacing:.2em;color:var(--m)}h1{margin:5px 0 2px;color:var(--g2);font-size:23px}.muted{color:var(--m)}.small{font-size:11px}.row{display:flex;gap:8px;align-items:center}.space{justify-content:space-between}.wrap{flex-wrap:wrap}
.sync{position:absolute;top:12px;left:12px;z-index:3;background:#09090bdc;border:1px solid var(--l);border-radius:999px;padding:6px 9px;font-size:10px;color:var(--m);transition:.2s}.sync.ok{opacity:0;pointer-events:none}
.bar{position:sticky;top:7px;z-index:20;margin:11px 0;padding:8px;background:#09090be9;backdrop-filter:blur(12px);border:1px solid var(--l);border-radius:16px}
.search{width:100%;border:1px solid var(--l);background:var(--p2);color:var(--t);padding:12px;border-radius:12px;outline:none}.chips{display:flex;gap:7px;overflow:auto;padding-top:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip,.ghost{border:1px solid var(--l);background:#17171a;color:var(--m);border-radius:999px;padding:8px 11px;white-space:nowrap}.chip.on{border-color:var(--g);color:var(--g2);background:#d7b64a14}
.head{display:flex;justify-content:space-between;align-items:center;margin:15px 2px 8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{position:relative}
.pic{aspect-ratio:3/4;background:#1c1c20;position:relative}.pic img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:10px}.name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{font-size:10px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.price{font-size:13px;font-weight:900;color:var(--g2);margin-top:8px}.old{text-decoration:line-through;color:var(--m);font-size:10px;margin-right:5px}
.badge{position:absolute;right:7px;top:7px;background:var(--g);color:#111;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:800}.fav{position:absolute;left:7px;bottom:7px;width:34px;height:34px;border-radius:50%;border:1px solid #fff2;background:#09090bd8;color:#fff;z-index:2}.fav.on{color:#ff86ad}
.skeleton{position:relative;overflow:hidden;background:#18181d}.skeleton:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#ffffff0c,transparent);animation:sh 1.25s infinite}@keyframes sh{100%{transform:translateX(100%)}}
.empty,.err{padding:28px;text-align:center;color:var(--m);font-size:12px}.err{color:#ffaaaa}.retry{margin-top:9px;border:1px solid #7b6530;background:#d7b64a12;color:var(--g2);border-radius:10px;padding:8px 12px}
.social{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.social a{padding:13px 8px;text-align:center;font-size:11px;font-weight:700}
.contact{margin-top:10px;padding:8px}.phone{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border-bottom:1px solid #26252a}.phone:last-of-type{border-bottom:0}.phoneLabel{font-size:10px;color:var(--m)}.phoneNumber{direction:ltr;unicode-bidi:isolate;text-align:left;font-size:13px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.address{margin-top:7px;padding:11px;font-size:11px;line-height:1.9;color:var(--m);border-top:1px solid #26252a}.foot{text-align:center;color:var(--m);font-size:10px;line-height:2;margin:18px}
.detail{display:none}.detail.show{display:block}.catalog.hide{display:none}.galleryMain{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.thumbs{display:flex;gap:6px;overflow:auto;padding:7px}.thumb{width:60px;height:60px;flex:0 0 60px;padding:0;border:1px solid var(--l);border-radius:9px;overflow:hidden;background:#111}.thumb img{width:100%;height:100%;object-fit:cover}
.info{padding:14px;margin-top:9px}.info h2{margin:0;font-size:18px}.txt{color:var(--m);font-size:12px;line-height:2;white-space:pre-wrap}.sizes{display:flex;gap:7px;flex-wrap:wrap}.size{border:1px solid var(--l);background:#17171a;color:var(--m);border-radius:10px;padding:9px 12px}.size.on{border-color:var(--g);color:var(--g2);background:#d7b64a12}.video{width:100%;border-radius:16px;border:1px solid var(--l);margin-top:9px}
.sticky{position:fixed;left:0;right:0;bottom:calc(10px + var(--safe));z-index:40;padding:0 12px}.stickyIn{max-width:536px;margin:auto;display:flex;gap:7px;padding:8px;background:#09090bed;border:1px solid var(--l);border-radius:16px}.order{flex:1;text-align:center;background:linear-gradient(135deg,var(--g),var(--g2));color:#111;border-radius:11px;padding:12px;font-weight:900}
.install{display:none;border:0;background:var(--g);color:#111;border-radius:10px;padding:8px 10px;font-weight:900}.install.show{display:block}.toast{position:fixed;top:15px;left:50%;transform:translate(-50%,-15px);opacity:0;z-index:80;background:#1c1c20;border:1px solid var(--l);padding:9px 13px;border-radius:11px;font-size:11px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.lb{position:fixed;inset:0;background:#000e;z-index:90;display:none;align-items:center;justify-content:center}.lb.show{display:flex}.lb img{max-width:96vw;max-height:90vh}.lb button{position:absolute;left:15px;top:15px;width:42px;height:42px;border-radius:50%;background:#222c;color:#fff;border:1px solid #fff3}
@media(max-width:370px){.grid{grid-template-columns:1fr}.phone{align-items:flex-start;flex-direction:column}.phoneNumber{font-size:12px}}
@media print{.bar,.fav,.sticky,.install,.social,.noPrint,.sync{display:none!important}body{background:#fff;color:#111}.panel{background:#fff;border-color:#ddd}.txt,.muted,.foot{color:#555}}
</style>
</head>
<body>
<main id="app" class="app">
<section id="catalog" class="catalog">
<header class="panel hero">
<img id="hero" class="heroBg" src="../icon.svg" alt="MODLAND" fetchpriority="high">
<div id="sync" class="sync">در حال همگام‌سازی…</div>
<div class="heroIn"><div class="row"><img id="logo" class="logo" src="../icon.svg" alt="MODLAND"><div><div id="wm" class="wm">MODLAND.QESHM</div><h1 id="title">کاتالوگ مدلند</h1></div></div><div id="tag" class="small muted" style="margin-top:8px">استایل خاص، انتخاب راحت، سفارش سریع</div></div>
</header>
<div class="bar"><input id="q" class="search" placeholder="جستجو با نام، کد یا برند…"><div id="chips" class="chips"><button class="chip on">همه</button></div></div>
<div class="head"><b>محصولات</b><div class="row"><span id="count" class="small muted"></span><button id="install" class="install">نصب</button></div></div>
<div id="grid" class="grid">
<div class="panel"><div class="pic skeleton"></div><div class="body"><div class="skeleton" style="height:14px;border-radius:6px"></div><div class="skeleton" style="height:12px;margin-top:9px;border-radius:6px;width:70%"></div></div></div>
<div class="panel"><div class="pic skeleton"></div><div class="body"><div class="skeleton" style="height:14px;border-radius:6px"></div><div class="skeleton" style="height:12px;margin-top:9px;border-radius:6px;width:70%"></div></div></div>
</div>
<div id="empty" class="empty" hidden>محصولی پیدا نشد.</div>
<div id="error" class="err" hidden>اتصال به کاتالوگ برقرار نشد.<br><button id="retry" class="retry">تلاش دوباره</button></div>
<div id="social" class="social"></div><div id="contact" class="panel contact" hidden></div>
<footer class="foot"><div id="footer"></div><div id="storeName"></div></footer>
</section>
<section id="detail" class="detail"><div class="row space noPrint" style="margin-bottom:9px"><button id="back" class="ghost">→ کاتالوگ</button><div class="row"><button id="share" class="ghost">اشتراک</button><button id="print" class="ghost">چاپ/PDF</button></div></div><div id="detailBody"></div></section>
</main>
<div id="sticky" class="sticky" hidden><div class="stickyIn"><a id="order" class="order" target="_blank" rel="noopener">سفارش در تلگرام</a><button id="copyOrder" class="ghost">کپی متن</button></div></div>
<div id="toast" class="toast"></div><div id="lb" class="lb"><button id="lbClose">×</button><img id="lbImg" alt="تصویر محصول"></div>
<script>
const BASE='https://bemkwibdtjrvrstlmvca.supabase.co',KEY='sb_publishable_oqpsHvl6ty2aYmAkxwfwfw_pjsN8a6p',BUCKET='modland-media',CACHE='modland_catalog_cache_v4';
let store=null,cats=[],products=[],media=[],cat=null,term='',current=null,size=null,deferInstall=null,refreshTimer=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),fa=n=>String(n??'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[+d]),money=n=>n==null?'تماس بگیرید':fa(Number(n).toLocaleString('en-US'))+' تومان';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function urlOf(m){let x=m?.external_url||m?.storage_path||'';if(/^https?:\/\//.test(x))return x;return x?`${BASE}/storage/v1/object/public/${BUCKET}/${x.replace(/^\/+/,'')}`:''}
function pm(id){const a=media.filter(m=>m.product_id===id&&m.is_visible!==false).sort((x,y)=>(x.sort_order??0)-(y.sort_order??0)||(x.created_at||'').localeCompare(y.created_at||''));const images=a.filter(x=>x.media_type!=='video'),videos=a.filter(x=>x.media_type==='video');return{images,videos,featured:images.find(x=>x.is_featured)||images[0]||null}}
function saved(){try{return new Set(JSON.parse(localStorage.getItem('modland_saved')||'[]'))}catch{return new Set()}}
function toggleFav(id){const s=saved();s.has(id)?s.delete(id):s.add(id);localStorage.setItem('modland_saved',JSON.stringify([...s]));renderProducts()}
function api(path){return fetch(`${BASE}/rest/v1/${path}`,{headers:{apikey:KEY,Accept:'application/json'},cache:'no-store'}).then(async r=>{if(!r.ok)throw Error(await r.text());return r.json()})}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE)||'null');if(!c||!Array.isArray(c.products))return false;store=c.store||null;cats=c.cats||[];products=c.products||[];media=c.media||[];hydrate();return true}catch{return false}}
function saveCache(){try{localStorage.setItem(CACHE,JSON.stringify({v:4,ts:Date.now(),store,cats,products,media}))}catch{}}
function hydrate(){applyStore();renderChips();renderProducts();const p=new URLSearchParams(location.search).get('p');if(p){const found=products.find(x=>x.code===p||x.id===p);if(found)openProduct(found.id,false)}}
function applyStore(){if(!store)return;$('#title').textContent=store.catalog_title||store.store_name||'کاتالوگ مدلند';$('#wm').textContent=store.watermark||'MODLAND.QESHM';$('#tag').textContent=store.tagline||'';$('#footer').textContent=store.footer_note||'';$('#storeName').textContent=store.store_name||'';if(store.logo_url){const x=/^https?:\/\//.test(store.logo_url)?store.logo_url:`${BASE}/storage/v1/object/public/${BUCKET}/${store.logo_url.replace(/^\/+/,'')}`;$('#logo').src=x}
const f=products[0]&&pm(products[0].id).featured;if(f)$('#hero').src=urlOf(f);
$('#social').innerHTML=[['instagram_url','اینستاگرام'],['telegram_url','تلگرام'],['rubika_url','روبیکا']].map(([k,l])=>store[k]?`<a class="panel" href="${esc(store[k])}" target="_blank" rel="noopener">${l}</a>`:'').join('');
const rows=[store.phone1,store.phone2].filter(Boolean).map((p,i)=>`<a class="phone" href="tel:${esc(String(p).replace(/[^\d+]/g,''))}"><span class="phoneLabel">تماس ${fa(i+1)}</span><span class="phoneNumber" dir="ltr">${esc(p)}</span></a>`).join('');
const address=store.address?`<div class="address">${esc(store.address)}</div>`:'';$('#contact').innerHTML=rows+address;$('#contact').hidden=!(rows||address)}
function renderChips(){const visible=cats.filter(c=>c.is_visible!==false);$('#chips').innerHTML=`<button class="chip ${cat===null?'on':''}" data-cat="">همه (${fa(products.length)})</button>`+visible.map(c=>`<button class="chip ${cat===c.id?'on':''}" data-cat="${c.id}">${esc(c.name)} (${fa(products.filter(p=>p.category_id===c.id).length)})</button>`).join('');$('#chips').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat||null;renderChips();renderProducts()})}
function renderProducts(){const q=term.trim().toLowerCase(),s=saved();const a=products.filter(p=>(!cat||p.category_id===cat)&&(!q||[p.name,p.code,p.brand,p.description,p.badge].filter(Boolean).some(v=>String(v).toLowerCase().includes(q))));$('#count').textContent=a.length?fa(a.length)+' محصول':'';$('#empty').hidden=!!a.length||!products.length;$('#grid').innerHTML=a.map(p=>{const m=pm(p.id).featured,u=urlOf(m);return `<article class="panel card"><button class="fav ${s.has(p.id)?'on':''}" data-f="${p.id}" aria-label="علاقه‌مندی">♥</button><a href="?p=${encodeURIComponent(p.code||p.id)}" data-p="${p.id}"><div class="pic">${u?`<img src="${esc(u)}" alt="${esc(p.name)}" loading="lazy" decoding="async">`:'<div class="empty">بدون تصویر</div>'}${p.badge?`<span class="badge">${esc(p.badge)}</span>`:''}</div><div class="body"><div class="name">${esc(p.name)}</div>${p.brand?`<div class="brand">${esc(p.brand)}</div>`:''}<div class="price">${money(p.price_toman)}${p.old_price_toman?`<span class="old">${money(p.old_price_toman)}</span>`:''}</div></div></a></article>`}).join('');
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();toggleFav(b.dataset.f)});document.querySelectorAll('[data-p]').forEach(a=>a.onclick=e=>{e.preventDefault();openProduct(a.dataset.p,true)})}
function orderUser(){return String(store?.order_id||'').trim().replace(/^@/,'')||'hamid_1094'}
function orderMessage(p){return `سلام، برای ${p.name}${p.code?` کد ${p.code}`:''}${size?` سایز ${size}`:''} پیام می‌دهم.`}
function openProduct(id,push){const p=products.find(x=>x.id===id);if(!p)return;current=p;size=null;const {images,videos}=pm(p.id),urls=images.map(urlOf).filter(Boolean);$('#catalog').classList.add('hide');$('#detail').classList.add('show');const gallery=urls.length?`<section class="panel"><img id="mainPic" class="galleryMain" src="${esc(urls[0])}" alt="${esc(p.name)}" fetchpriority="high">${urls.length>1?`<div class="thumbs">${urls.map((u,i)=>`<button class="thumb" data-img="${i}"><img src="${esc(u)}" alt="" loading="lazy"></button>`).join('')}</div>`:''}</section>`:`<section class="panel empty">تصویری ثبت نشده است</section>`;
const sizes=Array.isArray(p.sizes)&&p.sizes.length?`<section class="panel info"><b>سایزبندی</b><div class="sizes" style="margin-top:9px">${p.sizes.map(s=>`<button class="size" data-size="${esc(s)}">${esc(s)}</button>`).join('')}</div>${p.size_guide?`<div class="txt" style="margin-top:10px">${esc(p.size_guide)}</div>`:''}</section>`:'';
const vids=videos.map(v=>`<video class="video" src="${esc(urlOf(v))}" controls playsinline preload="metadata"></video>`).join('');
$('#detailBody').innerHTML=gallery+vids+`<section class="panel info"><div class="row space wrap"><div><h2>${esc(p.name)}</h2><div class="muted small">${esc(p.brand||'')}</div></div>${p.badge?`<span class="chip on">${esc(p.badge)}</span>`:''}</div><div class="price" style="font-size:19px;margin-top:14px">${money(p.price_toman)}</div><div class="row wrap" style="margin-top:10px"><span class="chip">${esc(p.stock_status||'')}</span>${p.code?`<button id="copyCode" class="ghost">کد ${esc(p.code)}</button>`:''}</div>${p.stock_note?`<div class="txt" style="margin-top:9px">${esc(p.stock_note)}</div>`:''}</section>`+sizes+(p.description?`<section class="panel info"><b>توضیحات</b><div class="txt">${esc(p.description)}</div></section>`:'')+(Array.isArray(p.features)&&p.features.length?`<section class="panel info"><b>ویژگی‌ها</b><div class="txt">${p.features.map(x=>'• '+esc(x)).join('\n')}</div></section>`:'')+(p.shipping_text?`<section class="panel info txt">${esc(p.shipping_text)}</section>`:'');
document.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>{$('#mainPic').src=urls[+b.dataset.img]});if($('#mainPic'))$('#mainPic').onclick=()=>{$('#lbImg').src=$('#mainPic').src;$('#lb').classList.add('show')};
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=size===b.dataset.size?null:b.dataset.size;document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('on',x.dataset.size===size));refreshOrder()});if($('#copyCode'))$('#copyCode').onclick=()=>navigator.clipboard.writeText(p.code).then(()=>toast('کد محصول کپی شد'));
refreshOrder();$('#sticky').hidden=false;if(push)history.pushState({p:p.id},'',`?p=${encodeURIComponent(p.code||p.id)}`);scrollTo({top:0,behavior:'instant'})}
function refreshOrder(){if(!current)return;$('#order').href=`https://t.me/${encodeURIComponent(orderUser())}`;$('#copyOrder').onclick=()=>navigator.clipboard.writeText(orderMessage(current)).then(()=>toast('متن سفارش کپی شد'))}
function closeProduct(push=true){current=null;size=null;$('#detail').classList.remove('show');$('#catalog').classList.remove('hide');$('#sticky').hidden=true;if(push)history.pushState({},'','./')}
async function refresh(){clearTimeout(refreshTimer);$('#sync').classList.remove('ok');$('#sync').textContent='در حال همگام‌سازی…';$('#error').hidden=true;try{
const storeP=api('store_profile?select=*&id=eq.main').then(x=>x[0]||null);
let data;
try{data=await api('products?select=*,categories(id,name,slug,is_visible,sort_order),product_media(*)&is_published=eq.true&order=sort_order.asc,created_at.asc')}
catch{const [ps,cs,ms]=await Promise.all([api('products?select=*&is_published=eq.true&order=sort_order.asc,created_at.asc'),api('categories?select=*&is_visible=eq.true&order=sort_order.asc'),api('product_media?select=*&is_visible=eq.true&order=sort_order.asc,created_at.asc')]);data=ps;cats=cs;media=ms}
store=await storeP;
if(data){products=data.map(({categories:category,product_media:pmx,...p})=>p);if(data.some(x=>x.categories)){const map=new Map;data.forEach(x=>{if(x.categories&&x.categories.is_visible!==false)map.set(x.categories.id,x.categories)});cats=[...map.values()].sort((a,b)=>(a.sort_order??0)-(b.sort_order??0))}if(data.some(x=>Array.isArray(x.product_media)))media=data.flatMap(x=>(x.product_media||[]).map(m=>({...m,product_id:m.product_id||x.id})))}
saveCache();hydrate();$('#sync').textContent='به‌روز شد';$('#sync').classList.add('ok')
}catch(e){console.error(e);if(!products.length){$('#grid').innerHTML='';$('#error').hidden=false;$('#empty').hidden=true}$('#sync').textContent='اتصال کند است';refreshTimer=setTimeout(()=>$('#sync').classList.add('ok'),2500)}}
$('#q').oninput=e=>{term=e.target.value;renderProducts()};$('#retry').onclick=refresh;$('#back').onclick=()=>closeProduct();$('#share').onclick=async()=>{const u=location.href;try{if(navigator.share)await navigator.share({title:current?.name||'MODLAND',url:u});else{await navigator.clipboard.writeText(u);toast('لینک کپی شد')}}catch{}};$('#print').onclick=()=>print();$('#lbClose').onclick=()=>$('#lb').classList.remove('show');$('#lb').onclick=e=>{if(e.target===$('#lb'))$('#lb').classList.remove('show')};addEventListener('popstate',()=>{const p=new URLSearchParams(location.search).get('p');if(p){const x=products.find(x=>x.code===p||x.id===p);if(x)openProduct(x.id,false)}else closeProduct(false)});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferInstall=e;$('#install').classList.add('show')});$('#install').onclick=async()=>{if(!deferInstall)return;deferInstall.prompt();await deferInstall.userChoice;deferInstall=null;$('#install').classList.remove('show')};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));
const hadCache=loadCache();if(hadCache){$('#sync').textContent='در حال بروزرسانی…'}refresh();
</script>
</body></html>
